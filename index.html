<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buoi 5</title>
    <!-- I.các kiểu viết style trong html -->
    <!-- loại 3:external style -->
     <link rel="stylesheet" href="index.css" type="text/css">
    <!-- loại 2:internal style -->
    <style>
        h2{
            color: red;/*corlor dùng để chỉ định màu chữ*/
        }
        #dh{
            color: aqua;
        }
        .dh{
            color: green;
        }
        h3.td2{
            color: orange;
        }
    </style>
</head>
<body>
    <!-- kiểu 1 viết style trong thẻ
     loại 1: inline style -->
    <h1 style="color: blue;">HUMG</h1>
    <!-- kiểu 2  
     -->
     <h2>Trường đại học mỏ địa chất</h2>
     <h3>lớp phát triển ứng dụng web</h3>
     <!-- II.selector 
      cách 1: dùng thẻ tên-->
        <h2>Trường đaị học mỏ địa chất</h2>
      <!-- cách 2:dùng id -->
        <h2 id="dh">Trường đaị học mỏ địa chất</h2>
      <!-- cách 3:dùng class -->
        <h2 class="dh">Trường đaị học mỏ địa chất</h2>
        <!--cách 3: dùng element, class  -->
        <h3 class="td2">Trường đaị học mỏ địa chất</h3>
</body>

</html>
